<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Breathing Shorts Composer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Nunito+Sans:wght@400;600;800&family=Inter:wght@300;400;500;600&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Serif+Devanagari:wght@600&display=block" rel="stylesheet">
<style>
  /* The app's own Inter files (gutsphere_app/app/assets/fonts), for the "app" style. */
  @font-face { font-family: "Gutsphere Inter"; src: url(art/brand/fonts/Inter-Regular.ttf); font-weight: 400; font-display: block; }
  @font-face { font-family: "Gutsphere Inter"; src: url(art/brand/fonts/Inter-SemiBold.ttf); font-weight: 600; font-display: block; }
  @font-face { font-family: "Gutsphere Inter"; src: url(art/brand/fonts/Inter-Bold.ttf); font-weight: 700; font-display: block; }
  body { margin: 0; background: #222; display: grid; place-items: center; min-height: 100vh; }
  canvas { max-width: 100vw; max-height: 100vh; }
  /* Forces both families to load before the first frame. */
  .warm { position: absolute; opacity: 0; font-family: Fraunces; } .warm b { font-family: "Nunito Sans"; font-weight: 800; }
</style>
</head>
<body>
<span class="warm">a<b>a</b></span>
<canvas id="out" width="1080" height="1920"></canvas>
<!-- Silhouette offset for the breathing outline: grow the mask (dilate), soften, re-threshold so the contour stays smooth. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="grow-outer" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
    <feMorphology operator="dilate" radius="20"/>
    <feGaussianBlur stdDeviation="4"/>
    <feComponentTransfer><feFuncA type="linear" slope="30" intercept="-4"/></feComponentTransfer>
  </filter>
  <filter id="grow-inner" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
    <feMorphology operator="dilate" radius="14"/>
    <feGaussianBlur stdDeviation="4"/>
    <feComponentTransfer><feFuncA type="linear" slope="30" intercept="-4"/></feComponentTransfer>
  </filter>
</svg>
<script type="module" src="compose.mjs"></script>
</body>
</html>
